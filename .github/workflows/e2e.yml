name: E2E

on:
  pull_request:
  push:
    branches: [main]

# One run per workflow and ref: a new push cancels the outdated run of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '25.2.1'
          cache: 'npm'

      # Installs exactly what package-lock.json says (fails if it is out of sync)
      - name: Install dependencies
        run: npm ci

      # Cheap checks first: fail fast before downloading browsers or building
      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # CI=true is set by GitHub Actions: playwright.config.ts then serves the build
      # with `next start`, uses 1 worker, 2 retries and the `github` reporter
      - name: E2E tests
        run: npm run test:e2e

      # `!cancelled()` so the report is uploaded when tests fail too, which is when it matters
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
